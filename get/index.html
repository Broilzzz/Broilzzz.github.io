<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Party Pop</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFF8EC">
<meta property="og:title" content="Party Pop: Party Games">
<meta property="og:description" content="Quick party games for 2–6 players. One phone or same Wi-Fi, no sign-up.">
<meta property="og:image" content="https://broilzzz.github.io/img/og.png">
<link rel="icon" type="image/png" href="/img/favicon.png">
<script>
(function () {
  var ios = "https://apps.apple.com/app/id6825810678";
  var play = "https://play.google.com/store/apps/details?id=com.ahilahmed.party_pop";
  var ua = navigator.userAgent || "";
  // Pass ?src=... through to Play's install referrer, e.g. /get?src=instagram
  var src = new URLSearchParams(location.search).get("src");
  if (src) play += "&referrer=" + encodeURIComponent("utm_source=" + src + "&utm_medium=ad");
  // iPadOS reports itself as a Mac, so also check for touch.
  var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
    (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if (isIOS) location.replace(ios);
  else if (/Android/i.test(ua)) location.replace(play);
})();
</script>
<style>
  :root { --bg: #FFF8EC; --ink: #2B1B3D; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1E1528; --ink: #FFF8EC; } }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 24px; padding: 16px;
    box-sizing: border-box; background: var(--bg); color: var(--ink);
    font: 600 18px/1.4 system-ui, sans-serif; text-align: center; }
  img.icon { width: 96px; height: 96px; border-radius: 22px; }
  .badges { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .badges img { height: 52px; }
  a.home { color: inherit; font-size: 15px; }
</style>
</head>
<body>
  <img class="icon" src="/img/icon-512.png" alt="Party Pop">
  <div>Get Party Pop</div>
  <div class="badges">
    <a href="https://apps.apple.com/app/id6825810678"><img src="/img/app-store-badge.svg" alt="Download on the App Store"></a>
    <a href="https://play.google.com/store/apps/details?id=com.ahilahmed.party_pop"><img src="/img/google-play-badge.png" alt="Get it on Google Play"></a>
  </div>
  <a class="home" href="/">More about Party Pop</a>
</body>
</html>
